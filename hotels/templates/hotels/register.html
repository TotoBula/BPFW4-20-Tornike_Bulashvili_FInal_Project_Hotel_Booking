{% load static %}
<!DOCTYPE html>
<html lang="ka">

<head>
    <meta charset="utf-8">
    <title>რეგისტრაცია - CheckIn.ge</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">

    <!-- Favicon -->
    <link href="{% static 'img/favicon.ico' %}" rel="icon">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost&family=Yeseva+One&family=Dancing+Script&display=swap" rel="stylesheet">

    <!-- Icon Font Stylesheet -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Libraries Stylesheet -->
    <link href="{% static 'lib/animate/animate.min.css' %}" rel="stylesheet">

    <!-- Customized Bootstrap Stylesheet -->
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">

    <!-- Template Stylesheet -->
    <link href="{% static 'css/style.css' %}" rel="stylesheet">

    <style>
        /* Django ფორმის ველების გალამაზება და Bootstrap-თან მორგება */
        .django-form p {
            margin-bottom: 1rem;
        }
        .django-form label {
            font-weight: 500;
            color: #333;
            margin-bottom: 0.3rem;
            display: inline-block;
        }
        .django-form input {
            display: block;
            width: 100%;
            padding: 0.5rem 0.75rem;
            font-size: 1rem;
            line-height: 1.5;
            color: #495057;
            background-color: #fff;
            background-clip: padding-box;
            border: 1px solid #ced4da;
            border-radius: 0.25rem;
            transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
        }
        .django-form input:focus {
            border-color: #80bdff;
            outline: 0;
            box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
        }
        .django-form .helptext, .django-form ul.errorlist {
            font-size: 85%;
            color: #6c757d;
            margin-top: 0.25rem;
            list-style: none;
            padding-left: 0;
        }
        .django-form ul.errorlist {
            color: #dc3545;
        }
    </style>
</head>

<body>

    <!-- Header Start -->
    <div class="container-fluid p-0">
        <nav class="navbar navbar-expand-lg navbar-dark px-lg-5 bg-dark">
            <a href="{% url 'home' %}" class="navbar-brand ms-4 ms-lg-0">
                <h1 class="mb-0 text-primary">CheckIn.ge</h1>
            </a>
            <button type="button" class="navbar-toggler me-4" data-bs-toggle="collapse" data-bs-target="#navbarCollapse">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarCollapse">
                <div class="navbar-nav mx-auto p-4 p-lg-0">
                    <a href="{% url 'home' %}" class="nav-item nav-link">მთავარი</a>
                    <a href="{% url 'hotel_list' %}" class="nav-item nav-link">სასტუმროები</a>
                    <a href="{% url 'all_rooms' %}" class="nav-item nav-link">ყველა ნომერი</a>
                </div>

                <div class="navbar-nav ms-auto align-items-center">
                    <a href="{% url 'login' %}" class="nav-item nav-link">შესვლა</a>
                    <a href="{% url 'register' %}" class="btn btn-primary px-3 ms-2 active">რეგისტრაცია</a>
                </div>
            </div>
        </nav>
    </div>
    <!-- Header End -->


    <!-- Page Header Start -->
    <div class="container-fluid page-header py-5 mb-5 wow fadeIn" data-wow-delay="0.1s" style="background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('/static/img/carousel-1.jpg') center center no-repeat; background-size: cover;">
        <div class="container text-center py-5">
            <h1 class="display-3 text-white mb-3 animated slideInDown">რეგისტრაცია</h1>
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb justify-content-center text-uppercase">
                    <li class="breadcrumb-item"><a href="{% url 'home' %}" class="text-white">მთავარი</a></li>
                    <li class="breadcrumb-item text-primary active" aria-current="page">ანგარიშის შექმნა</li>
                </ol>
            </nav>
        </div>
    </div>
    <!-- Page Header End -->


    <!-- Register Section Start -->
    <div class="container-fluid py-6">
        <div class="container" style="max-width: 500px;">
            <div class="bg-white p-5 rounded shadow-sm border">
                <div class="text-center mx-auto mb-4">
                    <p class="fs-4 font-dancing-script text-primary mb-0">Join Us</p>
                    <h2 class="display-6 mb-0">ახალი ანგარიში</h2>
                </div>

                <form method="POST">
                    {% csrf_token -->
                    
                    <!-- ფორმის ველები შეფუთული სპეციალური კლასით -->
                    <div class="django-form mb-4">
                        {{ form.as_p }}
                    </div>

                    <!-- ღილაკი შევცვალეთ მთავარი პირველადი (პრიმარული) ფერით -->
                    <button type="submit" class="btn btn-primary w-100 py-3">რეგისტრაცია</button>
                </form>

                <div class="text-center mt-4">
                    <p class="mb-0 text-muted">უკვე გაქვს ანგარიში? <a href="{% url 'login' %}" class="text-primary font-weight-bold">შესვლა</a></p>
                </div>
            </div>
        </div>
    </div>
    <!-- Register Section End -->


    <!-- Footer Start -->
    <div class="container-fluid bg-dark text-light footer pt-5 wow fadeIn" data-wow-delay="0.1s">
        <div class="container py-4 text-center">
            <p class="mb-0">&copy; CheckIn.ge Hotel Booking. All Rights Reserved.</p>
        </div>
    </div>
    <!-- Footer End -->


    <!-- JavaScript Libraries -->
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'lib/wow/wow.min.js' %}"></script>
    <script src="{% static 'lib/easing/easing.min.js' %}"></script>
    <script src="{% static 'lib/waypoints/waypoints.min.js' %}"></script>
    <script src="{% static 'js/main.js' %}"></script>
</body>

</html>
